name: Delete preview Neon branch

# The Neon integration makes a preview/<git-branch> database branch for each
# preview deployment, but deletes it only when Vercel removes the branch's
# last deployment, which can take months. Delete it when the PR closes.
# https://neon.com/docs/guides/vercel-branch-cleanup

on:
  pull_request:
    types: [closed]

jobs:
  delete-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
