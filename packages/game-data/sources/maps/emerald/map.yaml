# Emerald. Place names are the names the game records (pokeemerald's map
# sections). A Place's areas are PokeAPI's location areas; see generated/.
# Every location the player can walk in is a Place, because an egg can hatch
# there; Inside of Truck (the opening cutscene) is not. The S.S. Tidal has no
# map section of its own: a hatch there records MAPSEC_DYNAMIC, which the game
# names "FERRY" (GetMapNameGeneric in src/region_map.c).
